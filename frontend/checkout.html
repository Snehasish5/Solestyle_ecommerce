<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoleStyle — Step Into Style</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👟</text></svg>">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .checkout-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2.5rem;
      margin-top: calc(var(--navbar-height) + 2rem);
      padding-bottom: 5rem;
    }

    .checkout-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .checkout-items-preview {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .checkout-item-mini {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .checkout-item-img {
      width: 54px;
      height: 54px;
      border-radius: var(--radius-md);
      object-fit: cover;
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .checkout-item-info { flex: 1; min-width: 0; }
    .checkout-item-name { font-size: 0.875rem; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .checkout-item-sub { font-size: 0.75rem; color: var(--text-muted); }

    @media (max-width: 900px) {
      .checkout-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="nav-brand"><div class="nav-brand-logo">👟</div><span class="nav-brand-name">SoleStyle</span></a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="products.html" class="nav-link">Shop</a>
      </div>
      <div class="nav-actions">
        <a href="cart.html" class="nav-action-btn" title="Cart">🛒<span class="nav-badge" id="cart-badge" style="display:none">0</span></a>
        <div id="nav-user-area"></div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="breadcrumb" style="margin-top:calc(var(--navbar-height) + 1.5rem);justify-content:flex-start">
      <a href="index.html">Home</a> / <a href="cart.html">Cart</a> / <span>Checkout</span>
    </div>

    <div class="checkout-layout">
      <!-- FORM -->
      <div>
        <form id="checkout-form">
          <div class="checkout-card">
            <div class="checkout-section-title">
              <span class="step-num">1</span>
              <span>Shipping Address</span>
            </div>

            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" class="form-control" id="full_name" required placeholder="John Doe">
              </div>
              <div class="form-group">
                <label class="form-label">Phone Number *</label>
                <input type="tel" class="form-control" id="phone" required placeholder="9876543210">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Address Line 1 *</label>
              <input type="text" class="form-control" id="address_line1" required placeholder="House No, Street, Landmark">
            </div>

            <div class="form-group">
              <label class="form-label">Address Line 2 (Optional)</label>
              <input type="text" class="form-control" id="address_line2" placeholder="Apartment, Suite, Unit">
            </div>

            <div class="grid-3">
              <div class="form-group">
                <label class="form-label">City *</label>
                <input type="text" class="form-control" id="city" required placeholder="Mumbai">
              </div>
              <div class="form-group">
                <label class="form-label">State *</label>
                <input type="text" class="form-control" id="state" required placeholder="Maharashtra">
              </div>
              <div class="form-group">
                <label class="form-label">Pincode *</label>
                <input type="text" class="form-control" id="pincode" required placeholder="400001">
              </div>
            </div>
          </div>

          <div class="checkout-card">
            <div class="checkout-section-title">
              <span class="step-num">2</span>
              <span>Payment Method</span>
            </div>
            <div style="padding:1rem;background:rgba(124,58,237,0.08);border:1px solid var(--border-accent);border-radius:var(--radius-md);display:flex;align-items:center;gap:1rem">
              <span style="font-size:1.8rem">💳</span>
              <div>
                <div style="font-weight:600;color:var(--text-primary)">Razorpay Secure Gateway</div>
                <div style="font-size:0.8rem;color:var(--text-muted)">UPI, Credit/Debit Cards, Net Banking, Wallets</div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- SIDEBAR SUMMARY -->
      <div>
        <div class="cart-summary">
          <div class="cart-summary-title">Order Summary</div>

          <div class="checkout-items-preview" id="checkout-items-preview">
            <div class="skeleton" style="height:50px"></div>
          </div>

          <div class="divider"></div>

          <div class="summary-row">
            <span>Subtotal</span>
            <span id="summary-subtotal">₹0</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span id="summary-shipping" style="color:var(--success)">FREE</span>
          </div>
          <div class="summary-row total">
            <span>Total Payable</span>
            <span id="summary-total" style="color:var(--accent-secondary)">₹0</span>
          </div>

          <button type="submit" form="checkout-form" class="btn btn-gold btn-block btn-lg" id="pay-now-btn" style="margin-top:1.5rem">
            🔒Pay Now with Razorpay
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Razorpay SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    let cartData = null;

    document.addEventListener('DOMContentLoaded', () => {
      initNavbar();
      if (requireAuth()) {
        loadCheckoutSummary();
        prefillUserData();
      }
    });

    function prefillUserData() {
      const user = getUser();
      if (user) {
        document.getElementById('full_name').value = user.name || '';
        document.getElementById('phone').value = user.phone || '';
      }
    }

    async function loadCheckoutSummary() {
      const preview = document.getElementById('checkout-items-preview');
      try {
        cartData = await CartAPI.get();
        if (!cartData.items || cartData.items.length === 0) {
          showToast('Your cart is empty', 'warning');
          setTimeout(() => window.location.href = 'cart.html', 1500);
          return;
        }

        preview.innerHTML = cartData.items.map(item => `
          <div class="checkout-item-mini">
            <img src="${item.image || FALLBACK_SHOE_IMAGE}" class="checkout-item-img" onerror="this.onerror=null;this.src=FALLBACK_SHOE_IMAGE">
            <div class="checkout-item-info">
              <div class="checkout-item-name">${item.name}</div>
              <div class="checkout-item-sub">Qty: ${item.quantity} | Size: ${item.size}</div>
            </div>
            <div style="font-weight:600;font-size:0.85rem;color:var(--text-primary)">${formatPrice(item.subtotal)}</div>
          </div>
        `).join('');

        document.getElementById('summary-subtotal').textContent = formatPrice(cartData.subtotal);
        document.getElementById('summary-shipping').textContent = cartData.subtotal >= 999 ? 'FREE' : formatPrice(99);
        const finalTotal = cartData.subtotal >= 999 ? cartData.subtotal : cartData.subtotal + 99;
        document.getElementById('summary-total').textContent = formatPrice(finalTotal);

      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const address = {
        full_name: document.getElementById('full_name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        address_line1: document.getElementById('address_line1').value.trim(),
        address_line2: document.getElementById('address_line2').value.trim() || null,
        city: document.getElementById('city').value.trim(),
        state: document.getElementById('state').value.trim(),
        pincode: document.getElementById('pincode').value.trim(),
        country: 'India',
      };

      const btn = document.getElementById('pay-now-btn');
      btn.disabled = true;
      btn.textContent = 'Creating Payment Order...';

      try {
        // Step 1: Create Razorpay Order from backend
        const razorpayOrder = await OrdersAPI.createRazorpayOrder({ address });

        // Step 2: Configure Razorpay Checkout modal
        const options = {
          key: razorpayOrder.key,
          amount: razorpayOrder.amount,
          currency: razorpayOrder.currency,
          name: 'SoleStyle Store',
          description: `Order for ${cartData.total_items} item(s)`,
          image: 'https://via.placeholder.com/150?text=SoleStyle',
          order_id: razorpayOrder.razorpay_order_id,
          prefill: {
            name: address.full_name,
            email: razorpayOrder.user.email,
            contact: address.phone,
          },
          theme: {
            color: '#7c3aed',
          },
          handler: async function (response) {
            btn.textContent = 'Verifying Payment...';
            try {
              // Step 3: Verify signature on backend
              const verifyRes = await OrdersAPI.verifyPayment({
                razorpay_order_id: response.razorpay_order_id,
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_signature: response.razorpay_signature,
                address: address,
              });
              
              showToast('🎉Payment Successful! Order Placed.', 'success');
              updateCartBadge();
              setTimeout(() => {
                window.location.href = `orders.html?new_order=${verifyRes.order_id}`;
              }, 1500);

            } catch (err) {
              showToast(`Payment Verification Failed: ${err.message}`, 'error');
              btn.disabled = false;
              btn.innerHTML = '🔒Pay Now with Razorpay';
            }
          },
          modal: {
            ondismiss: function () {
              showToast('Payment window closed', 'info');
              btn.disabled = false;
              btn.innerHTML = '🔒Pay Now with Razorpay';
            }
          }
        };

        const rzp = new Razorpay(options);
        rzp.on('payment.failed', function (response) {
          showToast(`Payment Failed: ${response.error.description}`, 'error');
          btn.disabled = false;
          btn.innerHTML = '🔒Pay Now with Razorpay';
        });
        rzp.open();

      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '🔒Pay Now with Razorpay';
      }
    });
  </script>
</body>
</html>
